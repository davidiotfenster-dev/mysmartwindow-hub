# Levanta el sitio y el CMS juntos, con SQLite persistido en un volumen.
#
# Uso:
#   1. cp cms/.env.example cms/.env   y rellena los secretos (ver ese fichero)
#   2. docker compose up -d --build
#   3. Crea el primer admin en http://localhost:1337/admin
#   4. Crea un API token (Settings -> API Tokens -> Full access) y ejecuta el
#      seed una vez: STRAPI_API_TOKEN=xxxx node scripts/seed-cms.mjs
#
# El dominio real del sitio (NEXT_PUBLIC_SITE_URL) se incrusta al compilar la
# imagen `web`: cambialo en el build-arg de abajo, no como variable de entorno.
services:
  cms:
    build: ./cms
    restart: unless-stopped
    env_file: ./cms/.env
    environment:
      NODE_ENV: production
    volumes:
      - strapi-data:/opt/cms/.tmp
      - strapi-uploads:/opt/cms/public/uploads
    # Solo escucha en la propia maquina. El panel de Strapi es la llave de todo
    # el contenido del sitio: publicado en internet, cualquiera llega a su
    # pantalla de acceso y puede ponerse a probar contrasenas.
    #
    # La web no lo necesita publicado: le habla por la red interna de Docker
    # (STRAPI_URL: http://cms:1337). Para entrar al panel desde fuera se abre
    # un tunel, que ademas va cifrado:
    #   ssh -N -L 1338:localhost:1337 deploy@<servidor>
    # y luego http://localhost:1338/admin
    ports:
      - '127.0.0.1:1337:1337'

  web:
    build:
      context: .
      args:
        # La direccion publica del sitio. Se incrusta al compilar, no se lee al
        # arrancar: de aqui salen las URL canonicas, el sitemap, el hreflang y
        # las vistas previas al compartir enlaces.
        #
        # Mientras el dominio siga sirviendo el WordPress, el sitio se prueba
        # entrando por la IP del servidor: eso funciona igual. Lo que no hay
        # que hacer todavia es dar de alta el sitemap en Google, porque ya
        # anuncia el dominio y ahi aun no esta este sitio.
        #
        # Poner localhost aqui hace fallar la compilacion a proposito: es un
        # fallo que de otro modo pasaria inadvertido hasta tener el sitio ya
        # indexado con direcciones que no llevan a ninguna parte.
        NEXT_PUBLIC_SITE_URL: https://www.iotfenster.com
    restart: unless-stopped
    environment:
      STRAPI_URL: http://cms:1337
    depends_on:
      - cms
    # Sigue publicado mientras se prueba el sitio entrando por la IP. Cuando
    # el dominio ya responda por HTTPS, cambiar a '127.0.0.1:3000:3000' para
    # que solo se pueda llegar por Caddy: asi nadie entra por una puerta
    # lateral saltandose el HTTPS y las redirecciones.
    ports:
      - '3000:3000'

  # Recibe en el 80 y el 443, sirve el HTTPS y pasa al contenedor `web`.
  # El certificado se lo pide solo a Let's Encrypt en cuanto el dominio
  # apunte a esta maquina, y lo renueva sin que haya que programar nada.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Aqui viven los certificados: sin este volumen se volverian a pedir en
      # cada despliegue, y Let's Encrypt limita cuantas veces se puede hacer.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  strapi-data:
  strapi-uploads:
