# Dependabot: avisa de librerías con fallos de seguridad y abre el PR con el arreglo.
#  - «seguridad»: todas las de seguridad juntas en un PR por carpeta, en cuanto se publican.
#  - «menores-y-parches»: el resto de actualizaciones pequeñas, como mucho un PR por carpeta los lunes.
# Las versiones grandes (p. ej. Next 16 → 17) llegan sueltas: revisar con calma antes de fusionar.
version: 2
updates:
  - package-ecosystem: "npm"
    directories: ["/", "/cms"]
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Madrid" }
    open-pull-requests-limit: 3
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
      menores-y-parches:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Next 16 es una migración (cambia middleware, APIs asíncronas…), no una actualización: se
    # hará aparte y probada. Mientras, Dependabot la metía en el PR de «seguridad» solo para
    # subir un postcss que Next lleva dentro y que aquí no es explotable (solo procesa nuestro
    # propio CSS al compilar). Las correcciones de Next 15.x siguen llegando.
    # QUITAR estas tres entradas cuando se migre a Next 16.
    ignore:
      - dependency-name: "next"
        versions: [">=16.0.0"]
      - dependency-name: "@next/third-parties"
        versions: [">=16.0.0"]
      - dependency-name: "eslint-config-next"
        versions: [">=16.0.0"]
    labels: ["dependencias"]

  - package-ecosystem: "docker"   # imagen base de los Dockerfiles (node:22-alpine)
    directories: ["/", "/cms"]
    schedule: { interval: "monthly" }
    # Node 22 es la versión con soporte largo que usa todo el proyecto: no proponer 24/26.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencias"]
